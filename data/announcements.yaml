# Ignite 2026 security announcements, one row per announcement.
#
# scripts/check.py validates this file. scripts/render.py builds README.md and
# docs/index.html from it. Edit here, never in the generated files.
#
# Fields
#   id           lowercase slug, unique. Example rows start with "example-".
#   area         one of:
#                  Agentic SOC and Security Copilot
#                  Microsoft Perception and MDASH
#                  Microsoft Sentinel
#                  Defender XDR
#                  Defender for Endpoint, Identity, Office, Cloud Apps
#                  Defender for Cloud
#                  Security for AI
#                  Entra
#                  Purview
#                  DevSecOps
#                  Other
#   title        the announcement in plain words, one line.
#   status       GA | Public preview | Preview | Private preview | Announced
#                Microsoft's own wording in the primary source, nothing else.
#                Preview: the source says preview without saying public or
#                private. Announced: named without any preview or GA status.
#   available    date it is (or becomes) available: YYYY-MM-DD, or YYYY-MM when
#                Microsoft only names a month. Empty when no date is given.
#   source_url   the primary Microsoft source (Book of News public page, Microsoft
#                blog, Tech Community, Learn, GitHub blog or docs). No recaps,
#                no third-party posts.
#   learn_url    the Learn page for the feature. Empty when none exists yet.
#   sessions     Ignite session codes, for example [BRK123, LAB456]. [] when none.
#   what_changes one line: what changes for someone who runs this day to day.
#   do_monday    one line: what to do about it on Monday.
#   verified_at  YYYY-MM-DD, the day status and links were last checked
#                against source_url.
#   example      optional. true marks a fake row that renders only with
#                `python scripts/render.py --examples`.

announcements:

  # Microsoft Perception and MDASH

  - id: microsoft-perception
    area: Microsoft Perception and MDASH
    title: "Microsoft Perception, formerly Project Perception, generally available"
    status: GA
    available: 2026-11-17
    source_url: https://techcommunity.microsoft.com/blog/perception-blog/whats-new-with-microsoft-perception-at-ignite-2026/4571834
    learn_url: https://learn.microsoft.com/en-us/security/agentic-security/agentic-security-get-started
    sessions: [BRK323, BRK318, LTG1225]
    what_changes: "Red, blue and green team agents run through playbooks. The Triage Agent now covers about 80% of a typical Defender queue and handles AWS and Salesforce alerts."
    do_monday: "Run the Triage Agent next to your analysts for a week. Microsoft's 80% is an aggregate across tenants, not a promised rate for yours."
    verified_at: 2026-11-17

  - id: codename-mdash
    area: Microsoft Perception and MDASH
    title: "Codename MDASH, Microsoft's agentic code security system, in preview"
    status: Preview
    available: 2026-11-17
    source_url: https://news.microsoft.com/events/ignite/2026/book-of-news/
    learn_url: ""
    sessions: []
    what_changes: "More than 100 agents map, scan, debate and validate code findings. New: repository sharding, fewer false positives, and MAI Cyber 1.1 Flash, with MAI-Cyber-2 to follow."
    do_monday: "Preview is for eligible organizations. If you are one, start with a large repository and compare its validated findings with your CodeQL alerts."
    verified_at: 2026-11-17

  - id: perception-web-app-pen-test-agent
    area: Microsoft Perception and MDASH
    title: "Web App Pen Test Agent in Microsoft Perception"
    status: Preview
    available: 2026-11-17
    source_url: https://news.microsoft.com/events/ignite/2026/book-of-news/
    learn_url: ""
    sessions: []
    what_changes: "Validates exploitable weaknesses in an authorized web application and gives evidence and remediation guidance through the Run web pen test and Protect web app playbooks."
    do_monday: "Point it only at applications you are authorized to test. Start with one internet-facing app your team owns."
    verified_at: 2026-11-17

  - id: perception-posture-prioritization-agent
