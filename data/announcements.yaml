# Ignite 2026 security announcements, one row per announcement.
#
# scripts/check.py validates this file. scripts/render.py builds README.md and
# docs/index.html from it. Edit here, never in the generated files.
#
# Fields
#   id           lowercase slug, unique. Example rows start with "example-".
#   area         one of:
#                  Agentic SOC and Security Copilot
#                  Project Perception and MDASH
#                  Microsoft Sentinel
#                  Defender XDR
#                  Defender for Endpoint, Identity, Office, Cloud Apps
#                  Defender for Cloud
#                  Security for AI
#                  Entra
#                  Purview
#                  DevSecOps
#                  Other
#   title        the announcement in plain words, one line.
#   status       GA | Public preview | Preview | Private preview | Announced
#                Microsoft's own wording in the primary source, nothing else.
#                Preview: the source says preview without saying public or
#                private. Announced: named without any preview or GA status,
#                including dated retirements.
#   available    date it is (or becomes) available: YYYY-MM-DD, or YYYY-MM when
#                Microsoft only names a month. Empty when no date is given.
#   source_url   the primary Microsoft source (Book of News public page, Microsoft
#                blog, Tech Community, Learn, GitHub blog or docs). No recaps,
#                no third-party posts.
#   learn_url    the Learn page for the feature. Empty when none exists yet.
#   sessions     Ignite session codes, for example [BRK123, LAB456]. [] when none.
#   what_changes one line: what changes for someone who runs this day to day.
#   do_monday    one line: what to do about it on Monday.
#   verified_at  YYYY-MM-DD, the day status and links were last checked
#                against source_url.
#   example      optional. true marks a fake row that renders only with
#                `python scripts/render.py --examples`.

announcements:

