    do_monday: "It is in private preview, so for now make sure your agents are in the Agent 365 registry, since that is the data these playbooks start from."
    verified_at: 2026-11-17

  - id: perception-ai-readiness-initiatives
    area: Microsoft Perception and MDASH
    title: "AI Readiness Initiatives in Microsoft Perception"
    status: Announced
    available: 2027-01
    source_url: https://news.microsoft.com/events/ignite/2026/book-of-news/
