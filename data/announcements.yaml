    title: "Posture Prioritization Agent and the Plan for posture remediation playbook"
    status: GA
    available: 2026-11-17
    source_url: https://techcommunity.microsoft.com/blog/securityexposuremanagement/introducing-new-exposure-management-capabilities-in-microsoft-perception/4569977
    learn_url: ""
