    what_changes: "Ranks posture risks on exploitability, reachability and asset criticality, explains each one, and turns the findings into an ordered remediation plan."
    do_monday: "Run the playbook once and compare its ranking with the backlog your team works from now."
    verified_at: 2026-11-17

  - id: perception-risk-reduction-agent
    area: Microsoft Perception and MDASH
    title: "Risk Reduction Agent and the Reduce exposure risk playbook"
    status: Preview
    available: 2026-11-17
    source_url: https://techcommunity.microsoft.com/blog/securityexposuremanagement/introducing-new-exposure-management-capabilities-in-microsoft-perception/4569977
    learn_url: ""
    sessions: []
    what_changes: "Turns a prioritized exposure into a plan: patch through Intune when a fix exists, or shield the vulnerability meanwhile, with human approval for critical actions."
    do_monday: "Agree with your endpoint team who approves the Intune patching it proposes before you run it against production devices."
    verified_at: 2026-11-17

  - id: perception-secure-ai-agents-playbooks
    area: Microsoft Perception and MDASH
    title: "Perception playbooks to investigate and reduce AI agent risk"
    status: Private preview
    available: ""
    source_url: https://news.microsoft.com/events/ignite/2026/book-of-news/
